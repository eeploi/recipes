name: Change
description: Propose a new step or a change to one, before a pull request.
body:
  - type: markdown
    attributes:
      value: A security problem never goes here; see .github/SECURITY.md. No real server names, IP addresses or secrets; use fictional ones, such as `shop.example`.
  - type: textarea
    id: what
    attributes:
      label: What should change
      description: The step, and how a server comes out after the change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
