name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tags, for bin/release.sh

      - name: bash -n on every .sh
        run: git ls-files '*.sh' | xargs -n1 bash -n

      - name: Layout
        run: bin/check-layout.sh

      # The step files are fragments, so shellcheck runs on the script they make, as eeploi renders
      # it. SC1091: /etc/os-release is not there to follow.
      - name: shellcheck, the script for a new server
        run: |
          bin/render.sh > "$RUNNER_TEMP/first-boot.sh"
          shellcheck -e SC1091 "$RUNNER_TEMP/first-boot.sh"

      # Without first-boot/ nothing reads STEP, hence SC2034.
      - name: shellcheck, the script printed to run by hand
        run: |
          bin/render.sh --no-first-boot > "$RUNNER_TEMP/by-hand.sh"
          shellcheck -e SC1091,SC2034 "$RUNNER_TEMP/by-hand.sh"

      # The checks read the values, so they run as one script with them.
      - name: shellcheck, the checks
        run: |
          bin/render.sh --checks > "$RUNNER_TEMP/checks.sh"
          shellcheck -e SC1091 "$RUNNER_TEMP/checks.sh"

      - name: shellcheck, bin/ and the fingerprint
        run: shellcheck bin/*.sh stack/fingerprint.sh

      # The first boot's report to eeploi, against a fake eeploi with a short cap: taken, refused,
      # kept trying while eeploi is down or can't be reached, and never the token in the output.
      - name: report, against a fake eeploi
        run: bin/test-report.sh

      # A release from a tag made here only: every file in the package matches its manifest, the
      # package holds nothing else, and the steps are those of the list, in its order.
      - name: release, from a local tag
        run: |
          git tag v99.0.0
          bin/release.sh 99.0.0 0.1.0 example
          manifest=dist/99.0.0/recipes-99.0.0-example-ubuntu-26.04.manifest
          mkdir "$RUNNER_TEMP/package"
          tar -xzf dist/99.0.0/recipes-99.0.0.tar.gz -C "$RUNNER_TEMP/package"
          awk '$1 == "step" || $1 == "file" { print $2 "  " $NF }' "$manifest" > "$RUNNER_TEMP/sums"
          (cd "$RUNNER_TEMP/package" && sha256sum -c --quiet "$RUNNER_TEMP/sums")
          diff <(tar -tzf dist/99.0.0/recipes-99.0.0.tar.gz | grep -v '/$' | LC_ALL=C sort) <(awk '{ print $2 }' "$RUNNER_TEMP/sums" | LC_ALL=C sort)
          diff <(awk '$1 == "step" { print $NF }' "$manifest") <(grep -E '/[0-9]{2}-[^/]*\.sh$' ubuntu-26.04/steps)

      # A provider the helper would refuse is refused before anything else, with only its
      # message; the shortest and the longest names the helper takes, with a dash inside, build.
      - name: release, provider names
        run: |
          git tag v99.0.2
          long=example-$(printf '%024d' 0)
          for provider in Example -example example- "${long}0" example_1; do
            if out=$(bin/release.sh 99.0.2 0.1.0 example "$provider" 2>&1); then echo "$out"; echo "release took $provider"; exit 1; fi
            echo "$out"
            [ "$out" = "$provider is no provider name: a-z, 0-9 and inner -, at most 32" ]
            [ ! -e dist/99.0.2 ]
          done
          bin/release.sh 99.0.2 0.1.0 a "$long"
          for provider in a "$long"; do [ -f "dist/99.0.2/recipes-99.0.2-$provider-ubuntu-26.04.manifest" ]; done

      # In a copy of the tree: an always step with a value the helper does not fill fails the
      # layout, and does not render to run on its own. A step that is a link fails the layout, and
      # a link to php-source.sh, which the layout doesn't read, fails the release.
      - name: layout and release, refused
        run: |
          git worktree add -q --detach "$RUNNER_TEMP/refused" HEAD
          cd "$RUNNER_TEMP/refused"
          echo '# {ranges}' >> stack/09-logs.sh
          if out=$(bin/check-layout.sh); then echo "$out"; echo 'layout passed {ranges} in an always step'; exit 1; fi
          echo "$out"
          grep -qxF 'stack/09-logs.sh: is always, and holds a value the helper does not fill' <<< "$out"
          if bin/render.sh --step stack/09-logs.sh > /dev/null; then echo '--step rendered {ranges}'; exit 1; fi
          git checkout -q stack/09-logs.sh
          mv stack/09-logs.sh stack/09-logs.txt
          ln -s 09-logs.txt stack/09-logs.sh
          if out=$(bin/check-layout.sh); then echo "$out"; echo 'layout passed a link'; exit 1; fi
          echo "$out"
          grep -qxF 'ubuntu-26.04/steps: stack/09-logs.sh is a link' <<< "$out"
          rm stack/09-logs.sh
          mv stack/09-logs.txt stack/09-logs.sh
          mv ubuntu-26.04/php-source.sh ubuntu-26.04/php-source.txt
          ln -s php-source.txt ubuntu-26.04/php-source.sh
          git add -A
          git -c user.name=CI -c user.email=ci@example.invalid commit -qm 'A link'
          bin/check-layout.sh
          git tag v99.0.1
          if out=$(bin/release.sh 99.0.1 0.1.0 example 2>&1); then echo "$out"; echo 'release took a link'; exit 1; fi
          echo "$out"
          grep -qxF 'ubuntu-26.04/php-source.sh in v99.0.1 is no plain file (mode 120000)' <<< "$out"

      # In a copy of the tree, each a commit and tag of its own: a file in the list of steps with a
      # path the helper refuses, a part starting with - or . or holding a space, fails the release
      # with only its message; one with _ and inner . and - builds. A NUL in the list of steps or in
      # markers fails the release.
      - name: release, paths and NULs refused
        run: |
          git worktree add -q --detach "$RUNNER_TEMP/paths" HEAD
          cd "$RUNNER_TEMP/paths"
          n=0
          commit() {
            n=$((n + 1))
            git add -A
            git -c user.name=CI -c user.email=ci@example.invalid commit -qm "Case $n"
            git tag "v99.1.$n"
          }
          refused() {
            if out=$(bin/release.sh "99.1.$n" 0.1.0 example 2>&1); then echo "$out"; echo "release took $1"; exit 1; fi
            echo "$out"
            [ "$out" = "$2" ]
            [ ! -e "dist/99.1.$n" ]
            git reset -q --hard HEAD~1
          }
          for path in stack/-x.sh -stack/x.sh stack/.x.sh stack/../stack/values.sh 'stack/a b.sh'; do
            mkdir -p -- "$(dirname -- "$path")"
            [ -e "$path" ] || echo ': # a file' > "$path"
            echo "$path" >> ubuntu-26.04/steps
            commit
            refused "$path" "$path is no path the helper takes: each part [A-Za-z0-9_][A-Za-z0-9._-]*"
          done
          echo ': # a file' > stack/_x.y-z.sh
          echo stack/_x.y-z.sh >> ubuntu-26.04/steps
          commit
          bin/release.sh "99.1.$n" 0.1.0 example
          grep -q ' stack/_x.y-z.sh$' "dist/99.1.$n/recipes-99.1.$n-example-ubuntu-26.04.manifest"
          git reset -q --hard HEAD~1
          for file in ubuntu-26.04/steps markers; do
            printf '# a\0b\n' >> "$file"
            commit
            refused "a NUL in $file" "$file in v99.1.$n holds a NUL"
          done

      # Each always step in markers runs twice in a fresh Ubuntu 26.04 with systemd running, so a
      # step reloads a running service as on a live server, then its check. The host's kernel modules are mounted
      # read-only, so modprobe reads a real kernel's. A step that leaves a unit failed fails, and
      # the services still run after all of them. Then 07's check must fail without its apt
      # lines: every line of a check counts, not only the last.
      - name: always steps, twice, then their checks
        run: |
          docker build -t twice - <<'DOCKERFILE'
          FROM ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
          RUN apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -yq systemd systemd-sysv \
                fail2ban nginx needrestart unattended-upgrades kmod logrotate openssl && useradd -m deploy
          CMD ["/sbin/init"]
          DOCKERFILE
          docker run -d --name twice --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/recipes:ro" -v /lib/modules:/lib/modules:ro -w /recipes twice
          timeout 120 bash -c 'until docker exec twice systemctl is-system-running 2>/dev/null | grep -qE "^(running|degraded)$"; do sleep 2; done'
          docker exec twice bash -euc '
            systemctl is-active fail2ban nginx
            bin/run-twice.sh
            systemctl is-active fail2ban nginx
            rm /etc/apt/apt.conf.d/20auto-upgrades
            ! bash <(bin/render.sh --check stack/07-updates.sh)'

      # A step that leaves a unit failed fails bin/run-twice.sh: step 9, in a copy of the repo,
      # with a line more that breaks nginx. Then nginx runs again.
      - name: twice, a step that fails a unit
        run: |
          docker exec twice bash -euc '
            cp -a /recipes /tmp/recipes
            cd /tmp/recipes
            echo "echo broken > /etc/nginx/conf.d/broken.conf; systemctl restart nginx || true" >> stack/09-logs.sh
            if out=$(bin/run-twice.sh stack/09-logs.sh); then echo "$out"; echo "run-twice passed with nginx failed"; exit 1; fi
            echo "$out"
            grep -qE "^stack/09-logs.sh: left failed: (.* )?nginx.service( |$)" <<< "$out"
            rm /etc/nginx/conf.d/broken.conf
            systemctl reset-failed nginx
            systemctl start nginx'

      # Step 6 with another jail file broken: the step fails and leaves eeploi's jail as it was,
      # changed or not there. Then, with that file gone, the step and its check pass again.
      - name: fail2ban, a broken jail
        run: |
          docker exec twice bash -euc '
            jail=/etc/fail2ban/jail.d/eeploi.conf
            bin/render.sh --step stack/06-fail2ban.sh > /tmp/step
            echo "not a jail" > /etc/fail2ban/jail.d/broken.conf
            echo "# changed" >> $jail
            cp -a $jail /tmp/jail.old
            if bash /tmp/step; then echo "step passed with a broken jail"; exit 1; fi
            cmp $jail /tmp/jail.old
            [ ! -e $jail.prev ]
            rm $jail
            if bash /tmp/step; then echo "step passed with a broken jail"; exit 1; fi
            [ ! -e $jail ] && [ ! -e $jail.prev ]
            rm /etc/fail2ban/jail.d/broken.conf
            bash /tmp/step
            bash <(bin/render.sh --check stack/06-fail2ban.sh)
            systemctl is-active fail2ban'

      # Step 0 runs only at a first boot, so it is named here. Then its check passes with a comment
      # added, and fails on a key more, a key less, a key twice, another port, root as the user, and
      # another mode of the file or its directory.
      - name: values file, twice, then its check
        run: |
          docker exec twice bash -euc '
            bin/run-twice.sh stack/00-values.sh
            bin/render.sh --step stack/00-values.sh > /tmp/step
            bin/render.sh --check stack/00-values.sh > /tmp/check
            echo "# a comment" >> /etc/eeploi/recipes.conf; bash /tmp/check
            fails() { if bash /tmp/check > /dev/null 2>&1; then echo "check passed with $1"; exit 1; fi; bash /tmp/step; }
            echo FOO=1 >> /etc/eeploi/recipes.conf; fails "a key more"
            sed -i "/^PHP=/d" /etc/eeploi/recipes.conf; fails "a key less"
            echo PHP=8.4 >> /etc/eeploi/recipes.conf; fails "a key twice"
            sed -i "s/^SSH_PORT=.*/SSH_PORT=10023/" /etc/eeploi/recipes.conf; fails "another port"
            sed -i "s/^DEPLOY_USER=.*/DEPLOY_USER=root/" /etc/eeploi/recipes.conf; fails "root as the user"
            chmod 775 /etc/eeploi; fails "a directory others may change"
            chmod 600 /etc/eeploi/recipes.conf; fails "another mode"
            bash /tmp/check'

      # Every check runs on its own and leaves /etc and the units as they were, passing or not.
      # Then a check with a line more that writes to /etc fails it.
      - name: checks, read-only
        run: |
          docker exec twice bash -euc '
            bin/checks-read-only.sh
            cp -a /recipes /tmp/readonly
            cd /tmp/readonly
            echo "touch /etc/written" >> stack/09-logs.check.sh
            if out=$(bin/checks-read-only.sh stack/09-logs.sh); then echo "$out"; echo "a check that writes passed"; exit 1; fi
            echo "$out"
            grep -qxF "stack/09-logs.check.sh: changed the server" <<< "$out"
            rm /etc/written'

      # The fingerprint prints only known facts, in the container and on the runner, a real VM,
      # and leaves /etc as it was.
      - name: fingerprint
        run: |
          known='^(fingerprint 1|kernel [^ ]+|swap [0-9]+|cloud-init-datasource [^ ]+|default-user [^ ]+|apt-mirror [^ ]+|agent [^ ]+)$'
          docker exec twice bin/etc-state.sh > "$RUNNER_TEMP/etc.before"
          docker exec twice bash stack/fingerprint.sh > "$RUNNER_TEMP/fingerprint.container"
          sudo bash stack/fingerprint.sh > "$RUNNER_TEMP/fingerprint.runner"
          for out in "$RUNNER_TEMP"/fingerprint.*; do
            cat "$out"; echo
            [ "$(head -n 1 "$out")" = 'fingerprint 1' ]
            if grep -vE "$known" "$out"; then echo "unknown facts above in $out"; exit 1; fi
          done
          docker exec twice bin/etc-state.sh | diff "$RUNNER_TEMP/etc.before" -
