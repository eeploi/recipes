name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The one Ubuntu 26.04 image both jobs' containers start from, and the one helper release CI reads,
# with the helper's release key (key id A2C97024AB6219A8), pinned here, not read next to the release.
env:
  UBUNTU_IMAGE: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
  HELPER_TAG: v1.1.0
  HELPER_PUBKEY: RWSoGWKrJHDJoknVaEcX3dz5ew9zWZPqae2Qn2d3M+SGxNBT99NZGiLA

jobs:
  # The files and the release build: bash -n, the layout, shellcheck, the report to eeploi, the
  # release and its signatures, then each always step twice and each check in a fresh Ubuntu 26.04.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tags, for bin/build-release.sh

      - name: bash -n on every .sh
        run: git ls-files '*.sh' | xargs -n1 bash -n

      # bin/check-layout.sh: every file in ubuntu-*/steps has a path the helper takes (each part
      # [A-Za-z0-9_][A-Za-z0-9._-]*), exists and is no link; each step sets STEP=, has its check
      # (but the two in NO_CHECK, first-boot/00-helper-download.sh and first-boot/11-report.sh),
      # one marker in markers and a row in the README's step table; an always step holds no other
      # value than {user}, {port}, {php}, {version} and {name}.
      - name: Layout
        run: bin/check-layout.sh

      # Only prehashed signatures count, as on every server: each minisign -V in ci.yml and bin/
      # has -H, but for a line marked "legacy on purpose". Then a line without -H must fail it.
      - name: minisign -V, prehashed only
        run: |
          m=minisign
          unhashed() { grep -nE "^[^#]*${m}( [^#]*)? -V( |\$)" "$@" | grep -vE "^[^#]*${m}[^#]* -H( |\$)" | grep -v '# legacy on purpose' || true; }
          bad=$(unhashed .github/workflows/ci.yml bin/*.sh)
          [ -z "$bad" ] || { echo "$bad"; echo "minisign -V without -H above"; exit 1; }
          echo "$m -V -q -p key.pub -m file" > "$RUNNER_TEMP/unhashed.sh"
          [ -n "$(unhashed "$RUNNER_TEMP/unhashed.sh")" ]

      # The step files are fragments, so shellcheck runs on the script they make, as eeploi renders
      # it. SC1091: /etc/os-release is not there to follow.
      - name: shellcheck, the script for a new server
        run: |
          bin/render.sh > "$RUNNER_TEMP/first-boot.sh"
          shellcheck -e SC1091 "$RUNNER_TEMP/first-boot.sh"

      # Without first-boot/ nothing reads STEP, hence SC2034.
      - name: shellcheck, the script printed to run by hand
        run: |
          bin/render.sh --no-first-boot > "$RUNNER_TEMP/by-hand.sh"
          shellcheck -e SC1091,SC2034 "$RUNNER_TEMP/by-hand.sh"

      # The checks read the values, so they run as one script with them.
      - name: shellcheck, the checks
        run: |
          bin/render.sh --checks > "$RUNNER_TEMP/checks.sh"
          shellcheck -e SC1091 "$RUNNER_TEMP/checks.sh"

      - name: shellcheck, bin/ and the fingerprint
        run: shellcheck bin/*.sh stack/fingerprint.sh

      # The first boot's report to eeploi, against a fake eeploi with a short cap: taken, refused,
      # kept trying while eeploi is down or can't be reached, and never the token in the output.
      - name: report, against a fake eeploi
        run: bin/test-report.sh

      # A release from a tag made here only: every file in the package matches its manifest, the
      # package holds nothing else, and the steps are those of the list, in its order.
      - name: release, from a local tag
        run: |
          git tag v99.0.0
          bin/build-release.sh 99.0.0 0.1.0 example
          manifest=dist/99.0.0/recipes-99.0.0-example-ubuntu-26.04.manifest
          mkdir "$RUNNER_TEMP/package"
          tar -xzf dist/99.0.0/recipes-99.0.0.tar.gz -C "$RUNNER_TEMP/package"
          awk '$1 == "step" || $1 == "file" { print $2 "  " $NF }' "$manifest" > "$RUNNER_TEMP/sums"
          (cd "$RUNNER_TEMP/package" && sha256sum -c --quiet "$RUNNER_TEMP/sums")
          diff <(tar -tzf dist/99.0.0/recipes-99.0.0.tar.gz | grep -v '/$' | LC_ALL=C sort) <(awk '{ print $2 }' "$RUNNER_TEMP/sums" | LC_ALL=C sort)
          diff <(awk '$1 == "step" { print $NF }' "$manifest") <(grep -E '/[0-9]{2}-[^/]*\.sh$' ubuntu-26.04/steps)

      # The release above, signed with a throwaway key: it verifies against that key, and fails
      # against the recipes key in minisign.pub, with a manifest signed by another key, a changed
      # manifest signed again, a stale or missing .minisig, a legacy signature (by the prefix check and by
      # minisign -V -H alone), a changed package and a file not built.
      - name: release, verify the signatures
        run: |
          sudo apt-get install -yq minisign > /dev/null 2>&1 || { sudo apt-get update -q > /dev/null; sudo apt-get install -yq minisign > /dev/null; }
          k=$RUNNER_TEMP/keys
          mkdir "$k"
          minisign -G -W -p "$k/test.pub" -s "$k/test.key" > /dev/null
          minisign -G -W -p "$k/other.pub" -s "$k/other.key" > /dev/null
          d=dist/99.0.0
          m=$d/recipes-99.0.0-example-ubuntu-26.04.manifest
          minisign -S -s "$k/test.key" -m "$m" > /dev/null
          verify() { RECIPES_PUB=${RECIPES_PUB:-$k/test.pub} bin/build-release.sh --verify 99.0.0 0.1.0 example 2>&1; }
          refused() {
            if out=$(verify); then echo "$out"; echo "verify took $1"; exit 1; fi
            echo "$out"
            grep -qxF "$2" <<< "$out"
          }
          verify
          RECIPES_PUB=minisign.pub refused 'the test key for the recipes key' "$m.minisig does not verify the manifest v99.0.0 builds against minisign.pub"
          if out=$(verify); then grep -qxF 'NOT the recipes key in minisign.pub: RECIPES_PUB is set' <<< "$out"; else echo "$out"; exit 1; fi
          cp "$m" "$m.minisig" "$k/"
          minisign -S -s "$k/other.key" -m "$m" > /dev/null
          refused 'another key' "$m.minisig does not verify the manifest v99.0.0 builds against $k/test.pub"
          echo 'file x y' >> "$m"
          minisign -S -s "$k/test.key" -m "$m" > /dev/null
          refused 'a changed manifest' "$m is not the file v99.0.0 builds"
          cp "$k/${m##*/}" "$m"
          refused 'a stale .minisig' "$m.minisig does not verify the manifest v99.0.0 builds against $k/test.pub"
          minisign -S -l -s "$k/test.key" -m "$m" > /dev/null
          refused 'a legacy signature' "$m.minisig is no prehashed signature (ED): sign without -l"
          # minisign -V -H on its own refuses the legacy signature too, which minisign -V takes.
          minisign -V -q -p "$k/test.pub" -m "$m" -x "$m.minisig" # legacy on purpose: -V alone takes it
          if minisign -V -H -q -p "$k/test.pub" -m "$m" -x "$m.minisig"; then echo 'minisign -V -H took a legacy signature'; exit 1; fi
          rm "$m.minisig"
          refused 'no .minisig' "missing: ${m##*/}.minisig"
          cp "$k/${m##*/}.minisig" "$m.minisig"
          cp "$d/recipes-99.0.0.tar.gz" "$k/"
          echo x >> "$d/recipes-99.0.0.tar.gz"
          refused 'a changed package' "$d/recipes-99.0.0.tar.gz is not the file v99.0.0 builds"
          cp "$k/recipes-99.0.0.tar.gz" "$d/"
          touch "$d/extra"
          refused 'a file not built' 'not built: extra'
          rm "$d/extra"
          verify
          # RECIPES_DIR verifies another folder, as release.sh does with the release downloaded again.
          cp -R "$d" "$k/down"
          RECIPES_DIR=$k/down verify | grep -qF "in $k/down against"
          rm "$k/down/${m##*/}.minisig"
          RECIPES_DIR=$k/down refused 'no .minisig in RECIPES_DIR' "missing: ${m##*/}.minisig"
          if out=$(RECIPES_DIR=$k/x bin/build-release.sh 99.0.0 0.1.0 example 2>&1); then echo "$out"; echo 'RECIPES_DIR taken without --verify'; exit 1; fi
          [ "$out" = 'RECIPES_DIR is for --verify only' ]

      # The key in minisign.pub is the one every server checks: RECIPES_PUBKEY in the helper
      # release HELPER_TAG. The provider name rule in bin/build-release.sh and bin/release.sh is
      # the one recipe-run checks there, so a release never holds a provider the helper refuses;
      # a helper with another rule must fail it.
      - name: release, the recipes key and provider rule are the helper's
        run: |
          helper=$(curl -fsS --retry 3 "https://raw.githubusercontent.com/eeploi/helper/$HELPER_TAG/eeploi-helper")
          key=$(sed -n "s/^RECIPES_PUBKEY='\(.*\)'\$/\1/p" <<< "$helper")
          [ -n "$key" ] || { echo 'no RECIPES_PUBKEY in the helper'; exit 1; }
          [ "$key" = "$(sed -n 2p minisign.pub)" ] || { echo "minisign.pub is not the helper's RECIPES_PUBKEY ($key)"; exit 1; }
          same_rule() {
            local rule ours file
            # shellcheck disable=SC2016 # the $ is in a regex
            rule=$(sed -n 's/^ *\[\[ \$2 =~ \(.*\) \]\] || fail "invalid provider: \$2"$/\1/p' <<< "$1")
            [ "$(grep -c . <<< "$rule")" = 1 ] || { echo "not one provider rule in the helper: $rule"; return 1; }
            for file in bin/build-release.sh bin/release.sh; do
              ours=$(sed -n "s/^provider_name='\([^']*\)'.*/\1/p" "$file")
              [ "$ours" = "$rule" ] || { echo "$file: provider rule $ours, the helper's is $rule"; return 1; }
            done
          }
          same_rule "$helper"
          # shellcheck disable=SC2001 # sed: bash's own replace is slow on a file this size
          if same_rule "$(sed 's/{0,30}/{0,31}/' <<< "$helper")"; then echo 'another rule in the helper passed'; exit 1; fi

      # A provider the helper would refuse is refused before anything else, with only its
      # message; the shortest and the longest names the helper takes, with a dash inside, build.
      - name: release, provider names
        run: |
          git tag v99.0.2
          long=example-$(printf '%024d' 0)
          for provider in Example -example example- "${long}0" example_1; do
            if out=$(bin/build-release.sh 99.0.2 0.1.0 example "$provider" 2>&1); then echo "$out"; echo "release took $provider"; exit 1; fi
            echo "$out"
            [ "$out" = "$provider is no provider name: a-z, 0-9 and inner -, at most 32" ]
            [ ! -e dist/99.0.2 ]
          done
          bin/build-release.sh 99.0.2 0.1.0 a "$long"
          for provider in a "$long"; do [ -f "dist/99.0.2/recipes-99.0.2-$provider-ubuntu-26.04.manifest" ]; done

      # In a copy of the tree: an always step with a value the helper does not fill fails the
      # layout, and does not render to run on its own. A step that is a link fails the layout, as does
      # a file in the list with a path the helper refuses, and a link to php-source.sh, which the
      # layout doesn't read, fails the release.
      - name: layout and release, refused
        run: |
          git worktree add -q --detach "$RUNNER_TEMP/refused" HEAD
          cd "$RUNNER_TEMP/refused"
          echo '# {ranges}' >> stack/09-logs.sh
          if out=$(bin/check-layout.sh); then echo "$out"; echo 'layout passed {ranges} in an always step'; exit 1; fi
          echo "$out"
          grep -qxF 'stack/09-logs.sh: is always, and holds a value the helper does not fill' <<< "$out"
          if bin/render.sh --step stack/09-logs.sh > /dev/null; then echo '--step rendered {ranges}'; exit 1; fi
          git checkout -q stack/09-logs.sh
          mv stack/09-logs.sh stack/09-logs.txt
          ln -s 09-logs.txt stack/09-logs.sh
          if out=$(bin/check-layout.sh); then echo "$out"; echo 'layout passed a link'; exit 1; fi
          echo "$out"
          grep -qxF 'ubuntu-26.04/steps: stack/09-logs.sh is a link' <<< "$out"
          echo ': # a file' > stack/-x.sh
          echo stack/-x.sh >> ubuntu-26.04/steps
          if out=$(bin/check-layout.sh); then echo "$out"; echo 'layout passed a path the helper refuses'; exit 1; fi
          echo "$out"
          grep -qxF 'ubuntu-26.04/steps: stack/-x.sh is no path the helper takes: each part [A-Za-z0-9_][A-Za-z0-9._-]*' <<< "$out"
          git checkout -q ubuntu-26.04/steps
          rm stack/-x.sh
          rm stack/09-logs.sh
          mv stack/09-logs.txt stack/09-logs.sh
          mv ubuntu-26.04/php-source.sh ubuntu-26.04/php-source.txt
          ln -s php-source.txt ubuntu-26.04/php-source.sh
          git add -A
          git -c user.name=CI -c user.email=ci@example.invalid commit -qm 'A link'
          bin/check-layout.sh
          git tag v99.0.1
          if out=$(bin/build-release.sh 99.0.1 0.1.0 example 2>&1); then echo "$out"; echo 'release took a link'; exit 1; fi
          echo "$out"
          grep -qxF 'ubuntu-26.04/php-source.sh in v99.0.1 is no plain file (mode 120000)' <<< "$out"

      # In a copy of the tree, each a commit and tag of its own: a file in the list of steps with a
      # path the helper refuses, a part starting with - or . or holding a space, fails the release
      # with only its message; one with _ and inner . and - builds. A NUL in the list of steps or in
      # markers fails the release.
      - name: release, paths and NULs refused
        run: |
          git worktree add -q --detach "$RUNNER_TEMP/paths" HEAD
          cd "$RUNNER_TEMP/paths"
          n=0
          commit() {
            n=$((n + 1))
            git add -A
            git -c user.name=CI -c user.email=ci@example.invalid commit -qm "Case $n"
            git tag "v99.1.$n"
          }
          refused() {
            if out=$(bin/build-release.sh "99.1.$n" 0.1.0 example 2>&1); then echo "$out"; echo "release took $1"; exit 1; fi
            echo "$out"
            [ "$out" = "$2" ]
            [ ! -e "dist/99.1.$n" ]
            git reset -q --hard HEAD~1
          }
          for path in stack/-x.sh -stack/x.sh -stack/01-x.sh stack/.x.sh stack/../stack/values.sh 'stack/a b.sh'; do
            mkdir -p -- "$(dirname -- "$path")"
            [ -e "$path" ] || echo ': # a file' > "$path"
            echo "$path" >> ubuntu-26.04/steps
            commit
            refused "$path" "$path is no path the helper takes: each part [A-Za-z0-9_][A-Za-z0-9._-]*"
          done
          echo ': # a file' > stack/_x.y-z.sh
          echo stack/_x.y-z.sh >> ubuntu-26.04/steps
          commit
          bin/build-release.sh "99.1.$n" 0.1.0 example
          grep -q ' stack/_x.y-z.sh$' "dist/99.1.$n/recipes-99.1.$n-example-ubuntu-26.04.manifest"
          git reset -q --hard HEAD~1
          for file in ubuntu-26.04/steps markers; do
            printf '# a\0b\n' >> "$file"
            commit
            refused "a NUL in $file" "$file in v99.1.$n holds a NUL"
          done

      # Each always step in markers runs twice in a fresh Ubuntu 26.04 with systemd running, so a
      # step reloads a running service as on a live server, then its check (bin/run-twice.sh), with
      # only the values the helper fills and as the helper runs it: from /, with its PATH and a
      # clean environment. A step whose second run changes /etc fails. The host's kernel modules are mounted
      # read-only, so modprobe reads a real kernel's. A step that leaves a unit failed fails, and
      # the services still run after all of them. Then 07's check must fail with one interface
      # that sends redirects, and without its apt lines: every line of a check counts, not only the
      # last.
      - name: always steps, twice, then their checks
        run: |
          docker build --build-arg UBUNTU_IMAGE -t twice - <<'DOCKERFILE'
          ARG UBUNTU_IMAGE
          FROM $UBUNTU_IMAGE
          RUN apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -yq systemd systemd-sysv \
                fail2ban nginx needrestart unattended-upgrades kmod logrotate openssl && useradd -m deploy
          CMD ["/sbin/init"]
          DOCKERFILE
          docker run -d --name twice --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/recipes:ro" -v /lib/modules:/lib/modules:ro -w /recipes twice
          timeout 120 bash -c 'until docker exec twice systemctl is-system-running 2>/dev/null | grep -qE "^(running|degraded)$"; do sleep 2; done'
          docker exec twice bash -euc '
            systemctl is-active fail2ban nginx
            bin/run-twice.sh
            systemctl is-active fail2ban nginx
            bin/render.sh --check stack/07-updates.sh > /tmp/check-07
            echo 1 > /proc/sys/net/ipv4/conf/lo/send_redirects
            if bash /tmp/check-07 2> /tmp/out-07; then echo "07 check passed with lo sending redirects"; exit 1; fi
            grep -qxF "/proc/sys/net/ipv4/conf/lo/send_redirects is not 0" /tmp/out-07
            echo 0 > /proc/sys/net/ipv4/conf/lo/send_redirects
            bash /tmp/check-07
            rm /etc/apt/apt.conf.d/20auto-upgrades
            ! bash /tmp/check-07'

      # A step that leaves a unit failed fails bin/run-twice.sh: step 9, in a copy of the repo,
      # with a line more that breaks nginx. Then nginx runs again.
      - name: twice, a step that fails a unit
        run: |
          docker exec twice bash -euc '
            cp -a /recipes /tmp/recipes
            cd /tmp/recipes
            echo "echo broken > /etc/nginx/conf.d/broken.conf; systemctl restart nginx || true" >> stack/09-logs.sh
            if out=$(bin/run-twice.sh stack/09-logs.sh); then echo "$out"; echo "run-twice passed with nginx failed"; exit 1; fi
            echo "$out"
            grep -qE "^stack/09-logs.sh: left failed: (.* )?nginx.service( |$)" <<< "$out"
            rm /etc/nginx/conf.d/broken.conf
            systemctl reset-failed nginx
            systemctl start nginx'

      # Step 6 with another jail file broken: the step fails and leaves eeploi's jail as it was,
      # changed or not there. Then, with that file gone, the step and its check pass again.
      - name: fail2ban, a broken jail
        run: |
          docker exec twice bash -euc '
            jail=/etc/fail2ban/jail.d/eeploi.conf
            bin/render.sh --step stack/06-fail2ban.sh > /tmp/step
            echo "not a jail" > /etc/fail2ban/jail.d/broken.conf
            echo "# changed" >> $jail
            cp -a $jail /tmp/jail.old
            if bash /tmp/step; then echo "step passed with a broken jail"; exit 1; fi
            cmp $jail /tmp/jail.old
            [ ! -e $jail.prev ]
            rm $jail
            if bash /tmp/step; then echo "step passed with a broken jail"; exit 1; fi
            [ ! -e $jail ] && [ ! -e $jail.prev ]
            rm /etc/fail2ban/jail.d/broken.conf
            bash /tmp/step
            bash <(bin/render.sh --check stack/06-fail2ban.sh)
            systemctl is-active fail2ban'

      # The checks of steps 6 and 9 fail on their new lines: another SSH port in the jail, a jail
      # file without growing bans, the recidive jail or its values, another user in the log path or
      # the su line. Then each step writes its file again and its check passes.
      - name: checks of 6 and 9, the values
        run: |
          docker exec twice bash -euc '
            fails() {
              bin/render.sh --step $1 > /tmp/step
              bin/render.sh --check $1 > /tmp/check
              sed -i "$3" $2
              if bash /tmp/check > /tmp/out 2>&1; then echo "$1: check passed after $3"; exit 1; fi
              grep -qF "$4" /tmp/out || { cat /tmp/out; echo "$1: another line failed after $3"; exit 1; }
              bash /tmp/step
              bash /tmp/check
            }
            fails stack/06-fail2ban.sh /etc/fail2ban/jail.d/eeploi.conf "s/^port = .*/port = 10023/" "port = \$SSH_PORT"
            for change in "/^bantime.increment/d" "/^bantime.maxtime/d" "/^\[recidive\]/,\$d" \
              "/^\[recidive\]/,\$ s/^enabled = true/enabled = false/" "/^findtime/d"; do
              fails stack/06-fail2ban.sh /etc/fail2ban/jail.d/eeploi.conf "$change" "eeploi'"'"'s jail is not the one step 6 writes"
            done
            fails stack/09-logs.sh /etc/logrotate.d/eeploi "s|^/home/deploy/|/home/other/|" "/home/\$DEPLOY_USER"
            fails stack/09-logs.sh /etc/logrotate.d/eeploi "s/^    su .*/    su root root/" "su \$DEPLOY_USER"'

      # Step 0 runs only at a first boot, so it is named here. Then its check passes with a comment
      # added, and fails on a key more, a key less, a key twice, another port, root as the user, and
      # another mode of the file or its directory.
      - name: values file, twice, then its check
        run: |
          docker exec twice bash -euc '
            bin/run-twice.sh stack/00-values.sh
            bin/render.sh --step stack/00-values.sh > /tmp/step
            bin/render.sh --check stack/00-values.sh > /tmp/check
            echo "# a comment" >> /etc/eeploi/recipes.conf; bash /tmp/check
            fails() { if bash /tmp/check > /dev/null 2>&1; then echo "check passed with $1"; exit 1; fi; bash /tmp/step; }
            echo FOO=1 >> /etc/eeploi/recipes.conf; fails "a key more"
            sed -i "/^PHP=/d" /etc/eeploi/recipes.conf; fails "a key less"
            echo PHP=8.4 >> /etc/eeploi/recipes.conf; fails "a key twice"
            sed -i "s/^SSH_PORT=.*/SSH_PORT=10023/" /etc/eeploi/recipes.conf; fails "another port"
            sed -i "s/^DEPLOY_USER=.*/DEPLOY_USER=root/" /etc/eeploi/recipes.conf; fails "root as the user"
            chmod 775 /etc/eeploi; fails "a directory others may change"
            chmod 600 /etc/eeploi/recipes.conf; fails "another mode"
            bash /tmp/check'

      # Every check runs on its own, as the helper runs it, and leaves /etc, fail2ban and nginx as
      # they were, passing or not (bin/checks-read-only.sh). A failing check stops at its failing
      # line, so the lines after it are not tested here. Then a check with a line more that writes to /etc, or that restarts nginx, fails it.
      - name: checks, read-only
        run: |
          docker exec twice bash -euc '
            bin/checks-read-only.sh
            cp -a /recipes /tmp/readonly
            cd /tmp/readonly
            for line in "touch /etc/written" "systemctl restart nginx"; do
              cp /recipes/stack/09-logs.check.sh stack/
              echo "$line" >> stack/09-logs.check.sh
              if out=$(bin/checks-read-only.sh stack/09-logs.sh); then echo "$out"; echo "a check with $line passed"; exit 1; fi
              echo "$out"
              grep -qxF "stack/09-logs.check.sh: changed the server" <<< "$out"
              rm -f /etc/written
            done'

      # php-source.sh in a fresh container, as it writes /etc/apt, with apt-get, date and sleep
      # stubbed: a sync error is tried again for ten minutes, another error stops at once
      # (bin/test-php-source.sh).
      - name: PHP source, apt-get update tried again
        run: docker run --rm -v "$PWD:/recipes:ro" -w /recipes twice bin/test-php-source.sh

      # The fingerprint prints only known facts, in the container and on the runner, a real VM,
      # and leaves /etc as it was.
      - name: fingerprint
        run: |
          known='^(fingerprint 1|kernel [^ ]+|swap [0-9]+|cloud-init-datasource [^ ]+|default-user [^ ]+|apt-mirror [^ ]+|agent [^ ]+)$'
          docker exec twice bin/etc-state.sh > "$RUNNER_TEMP/etc.before"
          docker exec twice bash stack/fingerprint.sh > "$RUNNER_TEMP/fingerprint.container"
          sudo bash stack/fingerprint.sh > "$RUNNER_TEMP/fingerprint.runner"
          for out in "$RUNNER_TEMP"/fingerprint.*; do
            cat "$out"; echo
            [ "$(head -n 1 "$out")" = 'fingerprint 1' ]
            if grep -vE "$known" "$out"; then echo "unknown facts above in $out"; exit 1; fi
          done
          docker exec twice bin/etc-state.sh | diff "$RUNNER_TEMP/etc.before" -

  # A whole server, as eeploi builds one, then the helper's own recipe-run on a release built here:
  # every step and check of the release runs as on a live server, with the helper's PATH and clean
  # environment, and the run must end "result ok", twice. The helper is release HELPER_TAG, with a
  # test key for the recipes key and a local HTTPS server for GitHub's releases: those two lines only.
  # Twice: with Ubuntu's own PHP, and with a PHP from packages.sury.org, so its pinned key is tested.
  server:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4']
    env:
      GH_TOKEN: ${{ github.token }}
      RENDER_PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tags, for bin/build-release.sh

      # The helper release HELPER_TAG, its prehashed signature checked against the pinned release key.
      # Then the test key and the local server in, and nothing else changed.
      - name: the helper, with a test key
        run: |
          sudo apt-get install -yq minisign > /dev/null 2>&1 || { sudo apt-get update -q > /dev/null; sudo apt-get install -yq minisign > /dev/null; }
          h=$RUNNER_TEMP/helper
          gh release download "$HELPER_TAG" -R eeploi/helper -p eeploi-helper -p eeploi-helper.minisig -D "$h"
          minisign -V -H -q -P "$HELPER_PUBKEY" -m "$h/eeploi-helper"
          grep -qxF "VERSION='${HELPER_TAG#v}'" "$h/eeploi-helper"
          echo "HELPER_VERSION=${HELPER_TAG#v}" >> "$GITHUB_ENV"
          k=$RUNNER_TEMP/keys
          mkdir "$k"
          minisign -G -W -p "$k/test.pub" -s "$k/test.key" > /dev/null
          mkdir "$h/ci"
          sed -e "s#^RECIPES_PUBKEY=.*#RECIPES_PUBKEY='$(sed -n 2p "$k/test.pub")'#" \
            -e "s#^RECIPES_RELEASES=.*#RECIPES_RELEASES='https://localhost:8443'#" "$h/eeploi-helper" > "$h/ci/eeploi-helper"
          changed=$(diff "$h/eeploi-helper" "$h/ci/eeploi-helper") || true
          echo "$changed"
          [ "$(grep -c '^>' <<< "$changed")" = 2 ]

      # The release from a local tag, with the helper's version as min-helper, its manifest signed
      # with the test key, in the folders of a GitHub release.
      - name: release, signed with the test key
        run: |
          git tag v99.0.0
          bin/build-release.sh 99.0.0 "$HELPER_VERSION" example
          minisign -S -s "$RUNNER_TEMP/keys/test.key" -m dist/99.0.0/recipes-99.0.0-example-ubuntu-26.04.manifest > /dev/null
          mkdir -p "$RUNNER_TEMP/www"
          cp -R dist/99.0.0 "$RUNNER_TEMP/www/v99.0.0"
          ls -l "$RUNNER_TEMP/www/v99.0.0"

      # A fresh Ubuntu 26.04 with what a cloud image brings that the steps use: systemd, SSH, sudo,
      # logrotate.
      # First what eeploi renders itself, which bin/render.sh leaves out: root's password locked
      # (first-boot/00-lock-root.sh), the deploy user with a key, the helper and its sudo rule.
      # Then the script printed to run by hand, as eeploi renders it, with the matrix's PHP.
      - name: server, built
        run: |
          docker build --build-arg UBUNTU_IMAGE -t server - <<'DOCKERFILE'
          ARG UBUNTU_IMAGE
          FROM $UBUNTU_IMAGE
          RUN apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -yq systemd systemd-sysv \
                openssh-server sudo kmod iproute2 logrotate python3 openssl ca-certificates
          CMD ["/sbin/init"]
          DOCKERFILE
          docker run -d --name server -e RENDER_PHP --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/recipes:ro" -v "$RUNNER_TEMP/helper/ci:/helper:ro" -v "$RUNNER_TEMP/www:/www:ro" \
            -v /lib/modules:/lib/modules:ro -w /recipes server
          timeout 120 bash -c 'until docker exec server systemctl is-system-running 2>/dev/null | grep -qE "^(running|degraded)$"; do sleep 2; done'
          docker exec server bash -euc '
            bash first-boot/00-lock-root.sh
            useradd -m -s /bin/bash deploy
            passwd -l deploy > /dev/null
            install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
            ssh-keygen -q -t ed25519 -N "" -C ci -f /root/ci-key
            cp /root/ci-key.pub /home/deploy/.ssh/authorized_keys
            chown deploy:deploy /home/deploy/.ssh/authorized_keys
            chmod 600 /home/deploy/.ssh/authorized_keys
            install -d -m 755 /etc/eeploi
            echo DEPLOY_USER=deploy > /etc/eeploi/helper.conf
            install -m 755 /helper/eeploi-helper /usr/local/sbin/eeploi-helper
            echo "deploy ALL=(root) NOPASSWD: /usr/local/sbin/eeploi-helper" > /etc/sudoers.d/eeploi
            chmod 440 /etc/sudoers.d/eeploi
            visudo -cqf /etc/sudoers.d/eeploi
            bin/render.sh --no-first-boot > /root/by-hand.sh
            bash /root/by-hand.sh'

      # The release served over HTTPS on localhost, with a certificate the server trusts.
      - name: server, the release on a local HTTPS server
        run: |
          docker exec server bash -euc '
            openssl req -x509 -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -days 1 -subj /CN=localhost \
              -addext subjectAltName=DNS:localhost -keyout /root/tls.key -out /usr/local/share/ca-certificates/ci-releases.crt 2> /dev/null
            update-ca-certificates > /dev/null
            systemd-run -q --unit=releases python3 -c "
          import functools, http.server, ssl
          tls = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          tls.load_cert_chain(\"/usr/local/share/ca-certificates/ci-releases.crt\", \"/root/tls.key\")
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=\"/www\")
          server = http.server.ThreadingHTTPServer((\"127.0.0.1\", 8443), handler)
          server.socket = tls.wrap_socket(server.socket, server_side=True)
          server.serve_forever()"
            timeout 30 bash -c "until curl -fsS -o /dev/null https://localhost:8443/v99.0.0/recipes-99.0.0.tar.gz; do sleep 1; done"'

      # recipe-run through sudo as the deploy user, as eeploi runs it: the first run runs every
      # always step, the second finds each the same, and both end "result ok". Then a check that
      # fails makes the run fail: composer not executable.
      - name: server, recipe-run
        run: |
          docker exec server bash -euc '
            run() { runuser -u deploy -- sudo -n /usr/local/sbin/eeploi-helper recipe-run 99.0.0 example 2>&1; }
            ok() { out=$(run) || { echo "$out"; exit 1; }; echo "$out"; [ "$(tail -n 1 <<< "$out")" = "result ok" ]; }
            ok
            grep -q "^step ran " <<< "$out"
            ok
            if grep "^step " <<< "$out" | grep -v "^step same "; then echo "a step ran again"; exit 1; fi
            chmod -x /usr/local/bin/composer
            if out=$(run); then echo "$out"; echo "recipe-run passed without composer"; exit 1; fi
            echo "$out"
            grep -qxF "check failed ubuntu-26.04/01-packages.check.sh" <<< "$out"
            [ "$(tail -n 1 <<< "$out")" = "result failed" ]
            chmod +x /usr/local/bin/composer'

      # Step 4 runs again and changes nothing (and leaves the package's moduli file as it is), and its
      # check passes. Then the check fails on each setting turned back in a drop-in that sorts
      # first (a NIST curve, SHA-1 or the ECDSA host key back among them, or the post-quantum key
      # exchange not first), on a modulus under 3072 bits and on another mode of eeploi's moduli file.
      - name: server, the SSH check
        run: |
          docker exec server bash -euc '
            bin/render.sh --step stack/04-ssh.sh > /root/ssh-step
            bin/render.sh --check stack/04-ssh.sh > /root/ssh-check
            cp /etc/ssh/moduli /etc/ssh/eeploi-moduli /etc/ssh/sshd_config.d/00-eeploi.conf /root/
            bash /root/ssh-step
            cmp /root/moduli /etc/ssh/moduli
            cmp /root/eeploi-moduli /etc/ssh/eeploi-moduli
            cmp /root/00-eeploi.conf /etc/ssh/sshd_config.d/00-eeploi.conf
            bash /root/ssh-check
            for line in "Port 10023" "PermitRootLogin yes" "PasswordAuthentication yes" "KbdInteractiveAuthentication yes" \
              "PubkeyAuthentication no" "AllowUsers other" "MaxAuthTries 6" "LoginGraceTime 120" "MaxStartups 100" "X11Forwarding yes" \
              "AllowAgentForwarding yes" "AllowTcpForwarding yes" "AllowStreamLocalForwarding yes" "PermitTunnel yes" \
              "ModuliFile /etc/ssh/moduli" "KexAlgorithms +ecdh-sha2-nistp256" "KexAlgorithms sntrup761x25519-sha512,mlkem768x25519-sha256" \
              "MACs +hmac-sha1-etm@openssh.com" "HostKeyAlgorithms +ecdsa-sha2-nistp256" "HostKey /etc/ssh/ssh_host_ecdsa_key"; do
              echo "$line" > /etc/ssh/sshd_config.d/00-aaa.conf
              sshd -t
              if bash /root/ssh-check > /dev/null 2>&1; then echo "SSH check passed with $line"; exit 1; fi
            done
            rm /etc/ssh/sshd_config.d/00-aaa.conf
            echo "20260101000000 2 6 100 2047 2 FFFF" >> /etc/ssh/eeploi-moduli
            if bash /root/ssh-check > /dev/null 2>&1; then echo "SSH check passed with a 2048-bit modulus"; exit 1; fi
            cp /root/eeploi-moduli /etc/ssh/eeploi-moduli
            chmod 600 /etc/ssh/eeploi-moduli
            if bash /root/ssh-check > /dev/null 2>&1; then echo "SSH check passed with moduli 0600"; exit 1; fi
            chmod 644 /etc/ssh/eeploi-moduli
            bash /root/ssh-check'

      # PHP-FPM's stock [www] pool listens on a socket only root may open, and step 2's check passes.
      # Then it fails, with its own message, on each [www] setting turned back (pm static: with two workers, dynamic is no valid pool) and on expose_php or
      # session upload progress on again in a later conf.d file.
      - name: server, the PHP check
        run: |
          docker exec server bash -euc '
            v=$(sed -n "s/^PHP=//p" /etc/eeploi/recipes.conf)
            [ "$(stat -c "%U:%G %a" "/run/php/php$v-fpm.sock")" = "root:root 600" ]
            bin/render.sh --check stack/02-deploy-user.sh > /root/php-check
            bash /root/php-check
            www=/etc/php/$v/fpm/pool.d/www.conf
            cp "$www" /root/www.conf
            fails() {
              if bash /root/php-check > /root/out 2>&1; then echo "PHP check passed with $1"; exit 1; fi
              grep -qF "$2" /root/out || { cat /root/out; echo "PHP check failed on another line with $1"; exit 1; }
              cp /root/www.conf "$www"
              rm -f "/etc/php/$v/fpm/conf.d/99-zzz.ini"
            }
            sed -i "s/^pm = .*/pm = static/" "$www"; fails "pm static" "not pm = ondemand"
            sed -i "s/^pm.max_children = .*/pm.max_children = 5/" "$www"; fails "5 workers" "not pm.max_children = 2"
            sed -i "s/^listen.owner = .*/listen.owner = www-data/" "$www"; fails "owner www-data" "not listen.owner = root"
            sed -i "s/^listen.group = .*/listen.group = www-data/" "$www"; fails "group www-data" "not listen.group = root"
            sed -i "s/^listen.mode = .*/listen.mode = 0660/" "$www"; fails "mode 0660" "not listen.mode = 0600"
            echo "expose_php = On" > "/etc/php/$v/fpm/conf.d/99-zzz.ini"; fails "expose_php on" "expose_php is not off"
            echo "session.upload_progress.enabled = 1" > "/etc/php/$v/fpm/conf.d/99-zzz.ini"; fails "upload progress on" "upload_progress.enabled is not off"
            bash /root/php-check'

      # An unknown host gets no TLS handshake from nginx, and no certificate. Step 8's check fails,
      # with its own message, with the catch-all off, not the default server, without
      # ssl_reject_handshake, with a certificate in it, or with the old key or certificate back.
      - name: server, the nginx catch-all
        run: |
          docker exec server bash -euc '
            rc=0; curl -sk --max-time 10 -o /dev/null https://unknown.example --resolve unknown.example:443:127.0.0.1 || rc=$?
            [ "$rc" = 35 ] || { echo "curl exit $rc, not a refused handshake (35)"; exit 1; }
            bin/render.sh --check stack/08-nginx.sh > /root/nginx-check
            bash /root/nginx-check
            f=/etc/nginx/sites-available/catch-all
            cp "$f" /root/catch-all
            fails() {
              if bash /root/nginx-check > /root/out 2>&1; then echo "nginx check passed with $1"; exit 1; fi
              grep -qF "$2" /root/out || { cat /root/out; echo "nginx check failed on another line with $1"; exit 1; }
              cp /root/catch-all "$f"
            }
            rm /etc/nginx/sites-enabled/catch-all; fails "the catch-all off" "the catch-all is off"; ln -s "$f" /etc/nginx/sites-enabled/catch-all
            sed -i "s/^    listen 443 ssl default_server;/    listen 443 ssl;/" "$f"; fails "no IPv4 default" "not the IPv4 default"
            sed -i "s/^    listen \[::\]:443 ssl default_server;/    listen [::]:443 ssl;/" "$f"; fails "no IPv6 default" "not the IPv6 default"
            sed -i "/ssl_reject_handshake/d" "$f"; fails "no ssl_reject_handshake" "does not refuse the handshake"
            sed -i "s|ssl_reject_handshake on;|&\n    ssl_certificate /etc/nginx/ssl/x.crt;|" "$f"; fails "a certificate" "still has a certificate"
            touch /etc/nginx/ssl/catch-all.key; fails "the old key" "still has a certificate"; rm /etc/nginx/ssl/catch-all.key
            touch /etc/nginx/ssl/catch-all.crt; fails "the old certificate" "still has a certificate"; rm /etc/nginx/ssl/catch-all.crt
            bash /root/nginx-check'

      # The deploy user logs in with OpenSSH's own client, as eeploi does, with its ed25519 key: the
      # host keys offered are ed25519 and RSA only, and the ECDSA key file is still there.
      - name: server, an SSH login
        run: |
          docker exec server bash -euc '
            [ -f /etc/ssh/ssh_host_ecdsa_key ]
            keys=$(ssh-keyscan -p 10022 127.0.0.1 2> /dev/null | grep -v "^#" | cut -d" " -f2 | sort -u | paste -sd" ")
            echo "$keys"
            [ "$keys" = "ssh-ed25519 ssh-rsa" ]
            ssh -i /root/ci-key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/root/known_hosts \
              -p 10022 deploy@127.0.0.1 true
            ssh-keygen -F "[127.0.0.1]:10022" -f /root/known_hosts | grep -q ssh-ed25519'

      # ssh-audit (Ubuntu's package) against the server's SSH: a report on the crypto, never a gate.
      - name: server, ssh-audit report
        if: matrix.php == '8.5'
        continue-on-error: true
        run: |
          docker exec server bash -euc '
            DEBIAN_FRONTEND=noninteractive apt-get install -yq ssh-audit > /dev/null
            ssh-audit -n -p 10022 127.0.0.1 > /root/ssh-audit.txt 2>&1 || true'
          { echo '## ssh-audit'; echo; echo '```'; docker exec server cat /root/ssh-audit.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      # npm, as the deploy user runs it: the version the script pins, with nothing else printed,
      # and no update notice.
      - name: server, npm
        run: |
          pin=$(docker exec server grep -o 'npm@[0-9.]*$' /root/by-hand.sh)
          docker exec server runuser -u deploy -- env -i HOME=/home/deploy PATH=/usr/local/bin:/usr/bin:/bin PIN="$pin" bash -euc '
            cd
            out=$(npm --version 2>&1)
            echo "$out"
            [ "npm@$out" = "$PIN" ]
            [ "$(npm config get update-notifier)" = false ]'

      # Step 1's check fails on Ubuntu's globalignorefile back in the pinned npm's builtin config,
      # on the update notice back on, and on it turned on again after it is off.
      - name: server, the npm check
        run: |
          docker exec server bash -euc '
            npmrc=/usr/local/lib/node_modules/npm/npmrc
            bin/render.sh --check ubuntu-26.04/01-packages.sh > /root/check
            cp "$npmrc" /root/npmrc
            echo globalignorefile=/etc/npmignore >> "$npmrc"
            if bash /root/check; then echo "check passed with globalignorefile"; exit 1; fi
            cp /root/npmrc "$npmrc"
            sed -i "/^update-notifier=/d" "$npmrc"
            if bash /root/check; then echo "check passed with the update notice"; exit 1; fi
            cp /root/npmrc "$npmrc"
            echo "update-notifier = true" >> "$npmrc"
            if bash /root/check; then echo "check passed with the update notice on again"; exit 1; fi
            cp /root/npmrc "$npmrc"
            bash /root/check'

      # With a PHP from packages.sury.org, step 1's check fails on another key, another source line,
      # no source, no key, and the Launchpad PPA's key or source back.
      - name: server, the PHP source check
        if: matrix.php != '8.5'
        run: |
          docker exec server bash -euc '
            key=/etc/apt/keyrings/sury-php.asc src=/etc/apt/sources.list.d/sury-php.sources
            bin/render.sh --check ubuntu-26.04/01-packages.sh > /root/check
            bash /root/check
            cp "$key" "$src" /root/
            fails() { if bash /root/check > /dev/null 2>&1; then echo "check passed with $1"; exit 1; fi; cp /root/sury-php.asc "$key"; cp /root/sury-php.sources "$src"; }
            echo >> "$key"; fails "another key"
            sed -i "s|^URIs: .*|URIs: https://mirror.example/php|" "$src"; fails "another source"
            rm "$src"; fails "no source"
            rm "$key"; fails "no key"
            touch /etc/apt/keyrings/ondrej.asc; fails "the PPA key"; rm /etc/apt/keyrings/ondrej.asc
            touch /etc/apt/trusted.gpg.d/ondrej-ubuntu-php.gpg; fails "the PPA key in trusted.gpg.d"; rm /etc/apt/trusted.gpg.d/ondrej-ubuntu-php.gpg
            touch /etc/apt/sources.list.d/ondrej-ubuntu-php-resolute.sources; fails "the PPA source"
            rm /etc/apt/sources.list.d/ondrej-ubuntu-php-resolute.sources
            bash /root/check'

      # Lynis, last, on the server as the steps and recipe-run left it: a report to find what we
      # missed, never a gate. Ubuntu's own package, so nothing from Lynis is copied here. The
      # hardening index, the warnings and the suggestions go to the job summary, and the report
      # and log are kept as an artifact.
      - name: server, Lynis report
        if: matrix.php == '8.5'
        continue-on-error: true
        run: |
          docker exec server bash -euc '
            DEBIAN_FRONTEND=noninteractive apt-get install -yq lynis > /dev/null
            lynis audit system --quick --no-colors > /dev/null 2>&1 || true
            cp /var/log/lynis-report.dat /var/log/lynis.log /root/'
          mkdir "$RUNNER_TEMP/lynis"
          docker cp server:/root/lynis-report.dat "$RUNNER_TEMP/lynis/"
          docker cp server:/root/lynis.log "$RUNNER_TEMP/lynis/"
          r=$RUNNER_TEMP/lynis/lynis-report.dat
          {
            echo "## Lynis $(sed -n 's/^lynis_version=//p' "$r")"
            echo
            echo "Hardening index: $(sed -n 's/^hardening_index=//p' "$r")"
            echo
            echo "### Warnings"
            echo
            sed -n 's/^warning\[\]=/- /p' "$r"
            echo
            echo "### Suggestions"
            echo
            sed -n 's/^suggestion\[\]=/- /p' "$r"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: server, keep the Lynis report
        if: always() && matrix.php == '8.5'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lynis
          path: ${{ runner.temp }}/lynis/
          if-no-files-found: ignore
